# Zet prototype en app online via Cloudflare Pages (gratis). Doet niets zolang de
# secrets CLOUDFLARE_API_TOKEN en CLOUDFLARE_ACCOUNT_ID ontbreken.
# main  -> https://<repo>.pages.dev        andere branch -> https://<branch>.<repo>.pages.dev
name: Online
on:
  push:

permissions:
  contents: read
  pull-requests: write

jobs:
  online:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      NAAM: ${{ github.event.repository.name }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site samenstellen en publiceren
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Geen Cloudflare-secrets: overslaan."; exit 0; fi
          mkdir -p _site
          for d in index.html src assets prototype; do [ -e "$d" ] && cp -r "$d" _site/; done
          [ -f _site/index.html ] || echo '<meta http-equiv="refresh" content="0; url=prototype/">' > _site/index.html
          npx -y wrangler@3 pages project create "$NAAM" --production-branch main >/dev/null 2>&1 || true
          npx -y wrangler@3 pages deploy _site --project-name "$NAAM" --branch "$BRANCH" | tee uit.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' uit.txt | tail -1)
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ] && [ -n "$URL" ]; then gh pr comment "$PR" --body "🔗 Proberen: $URL"; fi
