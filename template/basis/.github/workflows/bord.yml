# Houdt het bord bij: nieuw issue -> Ideeën, fase-label -> bijbehorende kolom, gesloten -> Klaar.
# Er blijft altijd maar één fase-label over.
name: Bord
on:
  issues:
    types: [opened, labeled, closed, reopened]

permissions:
  issues: write
  contents: read

jobs:
  bord:
    if: github.event.action != 'labeled' || startsWith(github.event.label.name, 'fase:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      REPO: ${{ github.repository }}
      NR: ${{ github.event.issue.number }}
      ACTIE: ${{ github.event.action }}
      LABEL: ${{ github.event.label.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Kolom bepalen
        run: |
          HUIDIG=$(gh issue view "$NR" -R "$REPO" --json labels --jq '[.labels[].name]')
          case "$ACTIE" in
            opened|reopened)
              L=$(echo "$HUIDIG" | jq -r '[.[] | select(startswith("fase:"))][0] // ""')
              if [ -z "$L" ]; then gh issue edit "$NR" -R "$REPO" --add-label fase:ideeen; exit 0; fi
              KOLOM=$(bash .github/scripts/kolom.sh "$L") ;;
            closed)
              KOLOM="Klaar" ;;
            labeled)
              for l in $(echo "$HUIDIG" | jq -r '.[] | select(startswith("fase:") or . == "agent:klaar" or . == "agent:fout")'); do
                [ "$l" != "$LABEL" ] && gh issue edit "$NR" -R "$REPO" --remove-label "$l" >/dev/null
              done
              KOLOM=$(bash .github/scripts/kolom.sh "$LABEL") ;;
          esac
          bash .github/scripts/bord.sh "$REPO" "$NR" "$KOLOM"
