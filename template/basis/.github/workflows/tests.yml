# Draait de tests bij elke push en pull request.
name: Tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: Tests
        run: |
          if [ -f run-tests.sh ]; then bash run-tests.sh; else echo "Geen run-tests.sh"; fi
