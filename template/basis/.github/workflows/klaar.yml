# Kolom "Klaar": tests draaien, PR mergen, issue sluiten. Geen AI nodig.
name: Klaar
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  klaar:
    if: github.event.sender.login == github.repository_owner && github.event.label.name == 'fase:klaar'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      REPO: ${{ github.repository }}
      NR: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROJECT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest
      - name: PR zoeken, testen en mergen
        run: |
          PR=$(gh pr list -R "$REPO" --state open --json number,headRefName,body | jq -r --arg nr "$NR" \
            '[.[] | select((.headRefName | startswith("issue-" + $nr + "-")) or ((.body // "") | test("(?i)(closes|fixes|resolves) #" + $nr + "([^0-9]|$)")))][0].number // empty')
          if [ -z "$PR" ]; then
            gh issue close "$NR" -R "$REPO" --reason completed --comment "✅ Afgerond."
            exit 0
          fi
          gh pr checkout "$PR"
          if [ -f run-tests.sh ] && ! bash run-tests.sh; then
            gh issue edit "$NR" -R "$REPO" --add-label agent:fout || true
            gh issue comment "$NR" -R "$REPO" --body "❌ PR #$PR is niet gemerged: de tests falen. Zet het kaartje terug op Bouwen of Testen."
            exit 1
          fi
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch
          gh issue close "$NR" -R "$REPO" --reason completed --comment "✅ PR #$PR is gemerged naar main." 2>/dev/null || true
