# Bord-pad: zet op een ticket het label "agent: ontwerp" of "agent: realiseren".
#   ontwerp    -> Realisatie -> kort plan als reactie -> Review en Feedback
#   realiseren -> Realisatie -> Uitlevering (testen + mergen) -> Done
#                 (tests rood of geen wijzigingen -> Review en Feedback)
name: Agent
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  agent:
    if: >-
      startsWith(github.event.label.name, 'agent: ') &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: agent-${{ github.event.issue.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      BORD_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      NR: ${{ github.event.issue.number }}
      TITEL: ${{ github.event.issue.title }}
      LABEL: ${{ github.event.label.name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Voorbereiden
        id: v
        run: |
          AGENT="${LABEL#agent: }"
          if [ ! -f ".claude/agents/$AGENT.md" ]; then
            gh issue comment "$NR" --body "⚠️ Onbekende agent '$AGENT'. Kies \`agent: ontwerp\` of \`agent: realiseren\`."
            exit 1
          fi
          # Model en maximum aantal beurten per agent (klein houden spaart tokens).
          case "$AGENT" in
            ontwerp)    MODEL=sonnet; TURNS=30 ;;
            realiseren) MODEL=sonnet; TURNS=80 ;;
            *)          MODEL=sonnet; TURNS=40 ;;
          esac
          BRANCH="agent/$AGENT-$NR-${{ github.run_number }}"
          git switch -c "$BRANCH"
          {
            echo "agent=$AGENT"; echo "model=$MODEL"; echo "turns=$TURNS"; echo "branch=$BRANCH"
            echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          bash .github/scripts/status.sh "$NR" "Realisatie"
          gh issue comment "$NR" --body "🤖 Agent **$AGENT** is gestart. [Volg de voortgang]($RUN_URL)"

      - name: Agent aan het werk
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Je bent de agent "${{ steps.v.outputs.agent }}". Volg .claude/agents/${{ steps.v.outputs.agent }}.md (CLAUDE.md is al geladen).
            Ticket: #${{ github.event.issue.number }} — lees het met: gh issue view ${{ github.event.issue.number }} --comments
            Je staat al op branch ${{ steps.v.outputs.branch }}. NIET committen, pushen of PR's maken.
            Sluit af met één reactie op het ticket (gh issue comment ${{ github.event.issue.number }} --body "...").
          claude_args: >-
            --max-turns ${{ steps.v.outputs.turns }}
            --model ${{ steps.v.outputs.model }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(bash run-tests.sh:*),Bash(VERBOSE=1 bash run-tests.sh:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(git rm:*)"

      - name: Nieuwe vervolgtickets op het bord
        if: always() && steps.v.outputs.start != ''
        env:
          START: ${{ steps.v.outputs.start }}
        run: |
          for n in $(gh issue list --label later --state open --search "created:>=$START" --json number --jq '.[].number'); do
            bash .github/scripts/status.sh "$n" "ToDo"
          done

      - name: Ontwerp klaar
        if: steps.v.outputs.agent == 'ontwerp'
        run: bash .github/scripts/status.sh "$NR" "Review en Feedback"

      - name: Testen en uitleveren
        if: steps.v.outputs.agent != 'ontwerp'
        env:
          BRANCH: ${{ steps.v.outputs.branch }}
        run: |
          git config user.name "claude-agent"
          git config user.email "agent@users.noreply.github.com"
          # De Claude-actie zet git op een eigen token en trekt dat aan het eind in; terug naar het workflow-token.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          if git diff --cached --quiet; then
            bash .github/scripts/status.sh "$NR" "Review en Feedback"
            gh issue comment "$NR" --body "ℹ️ Geen wijzigingen, dus niets uit te leveren. Lees de reactie van de agent; mogelijk heeft hij een vraag."
            exit 0
          fi
          bash .github/scripts/status.sh "$NR" "Uitlevering"
          git commit -qm "$TITEL (#$NR)"
          TESTS=geslaagd
          if [ -f run-tests.sh ]; then bash run-tests.sh > tests.log 2>&1 || TESTS=gefaald; fi
          git push -q -u origin "$BRANCH"
          if [ "$TESTS" = geslaagd ]; then
            PR=$(gh pr create --base main --head "$BRANCH" --title "$TITEL" --body "Gemaakt door agent **realiseren**. Closes #$NR")
            gh pr merge "$PR" --squash --delete-branch
            gh issue close "$NR" --reason completed >/dev/null 2>&1 || true
            bash .github/scripts/status.sh "$NR" "Done"
            gh issue comment "$NR" --body "✅ Tests geslaagd en uitgeleverd naar main ($PR). Nog iets anders? Maak een nieuw ticket of heropen dit ticket."
          else
            PR=$(gh pr create --draft --base main --head "$BRANCH" --title "$TITEL (tests falen)" --body "Tests falen; niet gemerged. Zie #$NR.")
            bash .github/scripts/status.sh "$NR" "Review en Feedback"
            {
              echo "❌ De tests falen, dus er is **niet** uitgeleverd. Het werk staat in $PR."
              echo; echo "Zet \`agent: realiseren\` opnieuw om het te laten repareren, of pak het lokaal op met \`/oppakken $NR\`."
              echo; echo '<details><summary>Testuitvoer</summary>'; echo; echo '```'; tail -n 40 tests.log; echo '```'; echo '</details>'
            } > bericht.md
            gh issue comment "$NR" --body-file bericht.md
            exit 1
          fi

      - name: Label weghalen
        # zodat je dezelfde agent later opnieuw kunt kiezen
        if: always()
        run: gh issue edit "$NR" --remove-label "$LABEL" || true

      - name: Fout melden
        if: failure()
        run: |
          bash .github/scripts/status.sh "$NR" "Review en Feedback" || true
          gh issue comment "$NR" --body "⚠️ De agent is niet goed afgerond. [Bekijk wat er misging]($RUN_URL)" || true
