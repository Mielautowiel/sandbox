# Eenmalig: maakt labels en het bord "Werkplaats" (met veld Fase) aan.
# Start via: Actions -> Setup werkplaats -> Run workflow. Mag vaker; bestaande dingen blijven staan.
name: Setup werkplaats
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Controle token
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret PROJECT_TOKEN ontbreekt"; exit 1; fi
          gh api user --jq '"Ingelogd als " + .login'
      - name: Labels
        run: bash .github/scripts/labels.sh "$REPO"
      - name: Bord
        run: |
          NR=$(gh project list --owner "$OWNER" --format json --jq '.projects[] | select(.title=="Werkplaats") | .number' | head -1)
          if [ -z "$NR" ]; then
            NR=$(gh project create --owner "$OWNER" --title "Werkplaats" --format json --jq .number)
            gh project field-create "$NR" --owner "$OWNER" --name "Fase" --data-type SINGLE_SELECT \
              --single-select-options "Ideeën,Inventariseren,Naar project,Prototype,Feedback,Ontwerp,Te doen,Bouwen,Testen,Review,Klaar,Geparkeerd"
            echo "Bord aangemaakt (nummer $NR)"
          else
            echo "Bord bestaat al (nummer $NR)"
          fi
          gh project link "$NR" --owner "$OWNER" --repo "$REPO" || true
          {
            echo "## Bijna klaar"
            echo "Open https://github.com/users/$OWNER/projects/$NR en zet de weergave op **Board** met **Column by: Fase**."
          } >> "$GITHUB_STEP_SUMMARY"
