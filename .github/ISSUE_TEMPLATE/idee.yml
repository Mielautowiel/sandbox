name: 💡 Idee of wens
description: Een idee voor een nieuwe app of tool, of een wens voor een bestaande
labels: ["idee"]
body:
  - type: input
    id: wie
    attributes:
      label: Van wie komt het?
    validations:
      required: true
  - type: textarea
    id: wat
    attributes:
      label: Wat is het idee of de wens?
      description: Wat is het probleem, voor wie, wat moet het minimaal kunnen? Screenshots kun je hier direct in plakken.
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Voor een bestaand project? Welk?
