name: Ticket
description: Een idee, aanpassing of bug
body:
  - type: textarea
    id: wat
    attributes:
      label: Wat moet er gebeuren?
      description: Kort en concreet. Screenshots kun je hier direct in plakken.
    validations:
      required: true
  - type: textarea
    id: klaar
    attributes:
      label: Klaar als
      description: "Optioneel: 1-3 punten waaraan je ziet dat het klaar is."
  - type: markdown
    attributes:
      value: |
        Het ticket komt vanzelf in **ToDo** op het bord. Daarna kies je:
        - label `agent: realiseren` – de agent bouwt het; testen en mergen gaan automatisch;
        - label `agent: ontwerp` – eerst een kort plan om te beoordelen;
        - of lokaal in VS Code: `/oppakken <nummer>`.
